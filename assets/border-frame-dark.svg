<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#3a3a3c"/>
<stop offset="0.45" stop-color="#2a2a2c"/>
<stop offset="1" stop-color="#18181a"/>
</linearGradient>
<radialGradient id="rivetGrad" cx="35%" cy="30%" r="75%">
