<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3d3d40"/>
<stop offset="1" stop-color="#151517"/>
</linearGradient>
<linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d0d0f"/>
<stop offset="1" stop-color="#232326"/>
</linearGradient>
<linearGradient id="sym" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb640"/>
<stop offset="1" stop-color="#f08a0c"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
</filter>
</defs>

<rect x="2" y="2" width="56" height="56" rx="9" fill="url(#body)" stroke="#0a0a0b" stroke-width="1.5" filter="url(#sh)"/>
<rect x="3.5" y="3.5" width="53" height="53" rx="7.5" fill="none" stroke="#6a6a6e" stroke-opacity="0.45" stroke-width="1"/>

<rect x="9" y="9" width="42" height="42" rx="5" fill="url(#recess)" stroke="#f5a623" stroke-width="1.6"/>
<rect x="10.5" y="10.5" width="39" height="39" rx="4" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="1"/>
<g filter="url(#glow)"><rect x="19" y="27" width="22" height="6" rx="1.5" fill="url(#sym)"/><rect x="27" y="19" width="6" height="22" rx="1.5" fill="url(#sym)"/></g><circle cx="5.5" cy="5.5" r="1.6" fill="#0a0a0b"/><circle cx="5.2" cy="5.2" r="0.7" fill="#7a7a7e"/><circle cx="54.5" cy="5.5" r="1.6" fill="#0a0a0b"/><circle cx="54.2" cy="5.2" r="0.7" fill="#7a7a7e"/><circle cx="5.5" cy="54.5" r="1.6" fill="#0a0a0b"/><circle cx="5.2" cy="54.2" r="0.7" fill="#7a7a7e"/><circle cx="54.5" cy="54.5" r="1.6" fill="#0a0a0b"/><circle cx="54.2" cy="54.2" r="0.7" fill="#7a7a7e"/></svg>